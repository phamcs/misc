apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-traefik
  namespace: authentik
  annotations:
    # Crucial flag to handle Authentik's internal self-signed certificates backend
    # traefik.ingress.kubernetes.io/auth-signin: "https://authentik.superasian.net"
    # traefik.ingress.kubernetes.io/auth-url: "http://cluster.local"
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - authentik-server
    secretName: authentik-server-tls
  rules:
  - host: authentik-server
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authentik-server
            port:
              number: 80
