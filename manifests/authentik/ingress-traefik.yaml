apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-traefik
  namespace: authentik
  annotations:
    # Crucial flag to handle Authentik's internal self-signed certificates backend
    # traefik.ingress.kubernetes.io/auth-signin: "https://authentik.superasian.net"
    # traefik.ingress.kubernetes.io/auth-url: "http://cluster.local"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - authentik.superasian.net
    secretName: authentik-custom-ca
  rules:
  - host: authentik.superasian.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: authentik-server
            port:
              number: 80
