apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - ak-ingress-traefik.yaml    # Uncomment if using ingress

helmCharts:
  - name: authentik
    releaseName: authentik
    namespace: authentik
    version: "2026.8.5"
    repo: https://charts.goauthentik.io
    valuesFile: ak-values.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: authentik-server
      namespace: authentik
    patch: |-
      - op: replace
        path: /server/service/type
        value: LoadBalancer

      - op: add
        path: /server/service/loadBalancerIP
        value: 10.0.0.95