apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull the official base manifest directly from the Headlamp repository
resources:
  - kubernetes-headlamp.yaml
  #- helm-values.yaml
  - lb-patch.yaml
  #- oidc-patch.yaml

# (Optional) Customize your deployment context
namespace: headlamp

# (Optional) Add custom labels to all resources
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      #meta.helm.sh/release-name: headlamp

