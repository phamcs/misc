apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull the official base manifest directly from the Headlamp repository
resources:
- https://raw.githubusercontent.com/kubernetes-sigs/headlamp/main/kubernetes-headlamp.yaml

# (Optional) Customize your deployment context
namespace: headlamp

# (Optional) Add custom labels to all resources
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/managed-by: kustomize
    meta.helm.sh/release-name: headlamp

helmCharts:
- name: headlamp
  releaseName: headlamp
  namespace: headlamp
  version: "0.46.0"
  repo: https://kubernetes-sigs.github.io/headlamp/
  valuesFile: helm-values.yaml

# Applies the OIDC patch to the Headlamp deployment
# patches:
