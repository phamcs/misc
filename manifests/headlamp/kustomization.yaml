apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull the official base manifest directly from the Headlamp repository
resources:
  - kubernetes-headlamp.yaml
  #- helm-values.yaml
  #- lb-patch.yaml
  #- sa-secret-rbac-patch.yaml

# (Optional) Customize your deployment context
namespace: headlamp

# (Optional) Add custom labels to all resources
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      #meta.helm.sh/release-name: headlamp

# helmCharts:
#   - name: headlamp
#     releaseName: headlamp
#     namespace: headlamp
#     version: "0.46.0"
#     repo: https://kubernetes-sigs.github.io/headlamp/
#     valuesFile: helm-values.yaml

patches:
  - target:
      kind: Deployment
      name: headlamp # Change this if your deployment has a different name
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
            value: "CNY2TgFFK1qz08gaOcCTCV3yBdpTAigtVjFqylkr"
          - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
            value: "4BzqpfTj7MkcfuEJjBpJosDHtJxkzicjzfDX1QIa7TaXifWEk3amq7BxZtGBNYg0CUAQeER514vaXBE367adXeeWhKWawktl49wYSb3FmROeDF9n2i2VV31C3OcEBP1D"
          - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
            value: "https://authentik.superasian.net/application/o/headlamp/"
          - name: HEADLAMP_CONFIG_OIDC_SCOPES
            value: "openid,profile,email,groups" # Customize as needed