apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull the official base manifest directly from the Headlamp repository
resources:
  - https://raw.githubusercontent.com/kubernetes-sigs/headlamp/main/kubernetes-headlamp.yaml
  #- chart.yaml
  - lb-patch.yaml
  - oidc-patch.yaml

# (Optional) Customize your deployment context
namespace: headlamp

# (Optional) Add custom labels to all resources
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
    #meta.helm.sh/release-name: headlamp

patches:
  - target:
      kind: Deployment
      name: headlamp
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: headlamp
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: w0rk3r3
              kubernetes.io/arch: amd64
              kubernetes.io/os: linux