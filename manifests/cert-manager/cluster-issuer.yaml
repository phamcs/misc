apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cf-cluster-issuer
  namespace: cert-manager
spec:
  cloudflare: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cf-certificate
  namespace: cert-manager
spec:
  # The name of the custom Secret cert-manager will manage
  secretName: cf-ca-secret

  # Custom lifecycle rules
  duration: 2160h # 90 days
  renewBefore: 360h # Renew 15 days before expiration

  # Private key settings
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always # Generates a brand new private key on every renewal

  dnsNames:
    - app.superasian.net
    - api.superasian.net
    - analytics.superasian.net
    - argocd.superasian.net
    - awx.superasian.net
    - authentik.superasian.net

  issuerRef:
    name: cf-cluster-issuer
    kind: ClusterIssuer
