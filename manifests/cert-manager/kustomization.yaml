apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  #- https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  - ca-bundle.yaml
  - ca-issuer.yaml
  - secrets.yaml
  - service-certificate.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.21.2   # Replace with the latest or desired version
    releaseName: cert-manager
    valuesFile: cert-manager-values.yaml

  - name: trust-manager
    repo: https://charts.jetstack.io
    version: 0.26.0   # Replace with the latest or desired version
    releaseName: trust-manager
    valuesFile: trust-manager-values.yaml

patches:
  - target:
      kind: Deployment
      group: apps
      version: v1
      labelSelector: "app.kubernetes.io/instance=cert-manager"
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager
      spec:
        template:
          spec:
            crds:
              enable: true

