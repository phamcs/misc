apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  #- https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  - cert-trust-manager.yaml


helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.21.2   # Replace with the latest or desired version
    releaseName: cert-manager
    valuesFile: cert-manager-values.yaml

  - name: trust-manager
    repo: https://charts.jetstack.io
    version: 0.26.0   # Replace with the latest or desired version
    releaseName: trust-manager
    valuesFile: trust-manager-values.yaml

patches:
  - target:
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: "true"

  - target:
      version: v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave: "1" # Installs first

  - target:
      version: v1
      kind: Deployment
      name: trust-manager
      namespace: cert-manager
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave: "2" # Installs second