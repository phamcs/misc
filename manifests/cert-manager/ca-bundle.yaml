# ca-bundle.yaml
# apiVersion: trust.cert-manager.io/v1alpha1
# kind: Bundle
# metadata:
#   name: internal-ca-bundle
# spec:
#   sources:
#   - secret:
#       name: internal-ca-secret
#       key: tls.crt
#   target:
#     configMap:
#       key: ca-bundle.crt
# ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-root-ca
  secretName: internal-ca-secret # cert-manager stores keys here
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-ca-issuer # Assuming a self-signed bootstrap issuer exists
    kind: Issuer