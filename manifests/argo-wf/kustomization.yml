apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argowf

resources:
  - argo-server-ingress.yaml
  - ci-workflow.yaml
  - sso-secrets.yaml
  - trigger-workflow.yaml
  #- wfsa-rbac.yaml

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.16
    releaseName: awf
    namespace: argowf
    valuesFile: awf-values.yaml

