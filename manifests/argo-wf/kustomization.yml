apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - wf-deployment.yaml
  - argo-server-ingress.yaml
  - ci-workflow.yaml
  - trigger-workflow.yaml
  - wfsa-rbac.yaml
  - custom-wf-controller-cm.yaml

patches:
  - target:
      version: v1
      kind: Deployment
      name: argo-server
      namespace: argo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--auth-mode=sso"

