apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - wf-deployment.yaml
  - argo-server-http-ingress.yaml
  - argo-server-grpc-ingress.yaml
  - ci-workflow.yaml
  - trigger-workflow.yaml
  - wfsa-rbac.yaml
  #- workflow-controller-configmap.yaml

patches:
  - target:
      version: v1
      kind: Deployment
      name: argo-server
      namespace: argo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--auth-mode=sso"

  - target:
      version: v1
      kind: ConfigMap
      name: workflow-controller-configmap
      namespace: argo
    patch: |
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: workflow-controller-configmap
        namespace: argo
      data:
        sso: |
        # This is the root URL of the OIDC provider (required).
        issuer: https://authentik.superasian.net/application/o/argo-wf/
        # Some OIDC providers have alternate root URLs that can be included. These should be reviewed carefully. (optional)
        issuerAlias: https://authentik.superasian.net/application/o/argo-wf/
        # This defines how long your login is valid for (in hours). (optional)
        # If omitted, defaults to 10h. Example below is 10 days.
        sessionExpiry: 240h
        # This is name of the secret and the key in it that contain OIDC client
        # ID issued to the application by the provider (required).
        clientId:
          name: client-id
          key: gz9LNuNapgJ8l2583aWSdbmPsV9SQ52ni8NTHumm
        # This is name of the secret and the key in it that contain OIDC client
        # secret issued to the application by the provider (required).
        clientSecret:
          name: client-secret
          key: RFkLBsnou3AW2U1s9cuSh0GpjI3752hhYpBHX1H8PX7GFQ3NSbPUp9DxzjI80ggEGaDtYMg3UMp8ZGy72IEFg3haOZMvpvCsQEJbduQxl8oSrmRiJJlGNhGnA24meMW2
        # This is the redirect URL supplied to the provider (optional). It must
        # be in the form <argo-server-root-url>/oauth2/callback. It must be
        # browser-accessible. If omitted, will be automatically generated.
        redirectUrl: https://argo-server/oauth2/callback
        # Absolute URL to redirect to after logout in SSO mode. It additionally enables
        # OIDC provider logout when the provider advertises an end_session_endpoint, and
        # must be registered with the provider as a post-logout redirect URI. The server
        # fails to start in SSO mode if it is not an absolute HTTP(S) URL. (optional) >= v4.2.
        logoutRedirectUrl: https://argo-server/logged-out
        # Additional scopes to request. Typically needed for SSO RBAC.
        scopes:
        - groups
        - email
        - profile
        # RBAC Config.
        rbac:
          enabled: false
        # Skip TLS verify, not recommended in production environments. Useful for testing purposes.
        insecureSkipVerify: true
        # Custom PEM encoded CA certificate file contents. >= v4.0
        # Note: If CA certificates are mounted to the system certificate directory (/etc/ssl/certs on Linux), this config is not needed.
        rootCA: ""