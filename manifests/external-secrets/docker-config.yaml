apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-config
  namespace: argo-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: docker-config # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: .dockerconfigjson # Key name inside the generated K8s Secret
      remoteRef:
        key: argo-events/docker-config # Path in your external vault
        property: ".dockerconfigjson"
