apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

resources:
  - docker-access.yaml
  - eso-ingress.yaml
  - eso-rbac.yaml
  - github-access.yaml
  - vault-external.yaml

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.14.0   # Replace with the latest or desired version
    releaseName: external-secrets
    namespace: external-secrets
    valuesFile: values.yaml