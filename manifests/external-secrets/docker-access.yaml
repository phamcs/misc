apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry-credential
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: docker-registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{ "auths": { "index.docker.io": { "auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: dockerhub
      property: username
  - secretKey: password
    remoteRef:
      key: dockerhub
      property: password