apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry-credentials
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: docker-registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{ "auths": { "index.docker.io": { "auth": "{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: docker-registry # Path relative to the SecretStore mount path (do not include /data/)
        property: .dockerconfigjson
        decodingStrategy: Base64