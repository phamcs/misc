# Using External Secret to fetch secrets from External Vault for Docker Hub with dockerconfigjson method
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-registry-credentials
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: docker-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: dockerhub # Path relative to the SecretStore mount path (do not include /data/)
      property: .dockerconfigjson
      decodingStrategy: Base64
---
# Using External Secret to fetch secrets from External Vault for Docker Hub with Username and Token method
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: dockerhub-secrets
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .registry }}": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: registry
    remoteRef:
      key: dockerhub
      property: registry
  - secretKey: username
    remoteRef:
      key: dockerhub
      property: username
  - secretKey: password
    remoteRef:
      key: dockerhub
      property: password