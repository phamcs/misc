apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: shared-vault-secrets
spec:
  # Name given to the generated ExternalSecret in each target namespace
  externalSecretName: "docker-registry-credentials"

  # How often the controller checks for new matching namespaces
  refreshTime: "1m"

  # List of label selectors (OR'd together)
  namespaceSelectors:
    - matchLabels:
        secret-sync: "enabled"
        app.kubernetes.io/name: "argocd-repo-server"
  # Template for the ExternalSecret created in each matched namespace
  externalSecretSpec:
    refreshInterval: "1h"
    secretStoreRef:
      name: vault-external
      kind: ClusterSecretStore
    target:
      name: docker-registry-credentials
      creationPolicy: Owner
    data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: dockerhub # Path relative to the SecretStore mount path (do not include /data/)
        property: .dockerconfigjson
        decodingStrategy: Base64
