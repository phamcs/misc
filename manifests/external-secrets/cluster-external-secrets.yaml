apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: external-secrets-sync
spec:
  refreshTime: "1h"
  namespaceSelectors:
    - matchLabels:
        shared-secrets: "true"
  externalSecretSpec:
    - secretStoreRef:
        name: vault-external
        kind: ClusterSecretStore
      target:
        name: github-webhook-secret
      dataFrom:
        - extract:
            key: github
