apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: global-secret-sync
spec:
  refreshTime: "1h"
  namespaceSelectors:
    - matchLabels:
        shared-secrets: "true"
  externalSecretSpec:
    secretStoreRef:
      name: source-ns-store
      kind: ClusterSecretStore
    target:
      name: shared-app-secret
    dataFrom:
      - extract:
          key: docker-registry-credentials
