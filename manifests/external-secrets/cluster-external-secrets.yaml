apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: shared-vault-secrets
spec:
  # Name given to the generated ExternalSecret in each target namespace
  externalSecretName: "github-webhook-secret"

  # How often the controller checks for new matching namespaces
  refreshTime: "1m"

  # List of label selectors (OR'd together)
  namespaceSelectors:
    - matchLabels:
        secret-sync: "enabled"
        eventsource-name: "github"
  # Template for the ExternalSecret created in each matched namespace
  externalSecretSpec:
    refreshInterval: "1h"
    secretStoreRef:
      name: vault-external
      kind: ClusterSecretStore
    target:
      name: github-webhook-secret
      creationPolicy: Owner
    data:
      - secretKey: secret
        remoteRef:
          key: github
          property: secret
      - secretKey: token
        remoteRef:
          key: github
          property: token
