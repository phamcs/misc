apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-secret
  namespace: argo-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: dockerhub-access # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: username # Key name inside the generated K8s Secret
      remoteRef:
        key: argo-events/dockerhub # Path in your external vault
        property: "username"
    - secretKey: password # Key name inside the generated K8s Secret
      remoteRef:
        key: argo-events/dockerhub # Path in your external vault
        property: "password"