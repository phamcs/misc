# Example using External Vault to fetch Github secrets for External Secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: github-webhook-secret # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: secret #  Github-Webhook secret
      remoteRef:
        key: github # Path in your external vault
        property: secret
    - secretKey: token #  Github-Access using token
      remoteRef:
        key: github # Path in your external vault
        property: token