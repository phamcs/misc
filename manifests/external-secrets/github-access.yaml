apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: argo-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-access # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: secret # Key name inside the generated K8s Secret
      remoteRef:
        key: argo-events/github # Path in your external vault
        property: secret
