apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: argo-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: github-access # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: secret #  Github-Webhook secret
      remoteRef:
        key: argo-events/github # Path in your external vault
        property: secret
    - secretKey: token #  Github-Webhook secret
      remoteRef:
        key: argo-events/github # Path in your external vault
        property: token