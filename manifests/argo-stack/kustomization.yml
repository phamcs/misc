apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#namespace: argo
configurations:
- rollout-transform.yaml

resources:
  - argo-server-ingress.yaml
  - ci-workflow.yaml
  - eventbus.yaml
  - eventsource.yaml
  - rollout-carnary.yaml
  - rollouts-dashboard-ingress.yaml
  - rollout-transform.yaml
  - sso-secrets.yaml
  - sensor.yaml
  - sensor-rbac.yaml
  - trigger-workflow.yaml

  #- wf-templates/*.yaml

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: workflows-values.yaml

  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: events-values.yaml

  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: 2.43.11
    releaseName: aro
    namespace: argo-rollouts
    valuesFile: rollouts-values.yaml
