apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

#namespace: argo-events

resources:
  - events/ae-binding.yaml
  - events/ae-ingress.yaml
  - events/ae-linter.yaml
  - events/ae-role.yaml
  - events/eventbus.yaml
  - events/eventsource.yaml
  - events/sensor.yaml
  - events/sensor-rbac.yaml
  - workflows/awf-server-ingress.yaml
  - workflows/awf-server-sso.yaml
  - stack/templates/buildkit.yaml
  - stack/templates/caddy-go-build.yaml
  - stack/templates/cluster-wf-tpl.yaml
  - stack/templates/go-build.yaml
  - stack/templates/jenkins-pipeline.yaml
  - stack/templates/gh-ci-pipeline.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml

  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: awf-values.yaml