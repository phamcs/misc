apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events
  namespace: argo-events
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: argo-events-binding
  annotations:
    argocd.argoproj.io/tracking-id: >-
      argo-events:rbac.authorization.k8s.io/ClusterRoleBinding:argo-events/argo-events-binding
subjects:
  - kind: ServiceAccount
    name: argo-events
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-role