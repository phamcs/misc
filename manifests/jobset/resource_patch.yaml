apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobset-controller-manager
  namespace: jobset-system
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: w0rk3r3
      containers:
      - name: manager
        resources:
          requests:
            cpu: "1"
            memory: "256Mi"
          limits:
            cpu: "4"
            memory: "1Gi"