apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx-operator
  namespace: awx
spec:
  # Service type LoadBalancer with static IP
  admin_user: admin
  service_type: LoadBalancer
  loadbalancer_ip: '10.0.0.92'
  loadbalancer_port: 80
  loadbalancer_protocol: http
  ingress_type: none
  bundle_cacert_secret: awx-custom-ca
  postgres_configuration_secret: awx-postgres-config
  # Use Intel node for x86-64-v2 support
  # Use Intel node for x86-64-v2 support
  node_selector: |
    kubernetes.io/hostname: w0rk3r8
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux

  extra_settings:
    - setting: ALLOW_METRICS_FOR_ANONYMOUS_USERS
      value: "True"
    # Injecting the generic OIDC configuration via extra_settings
    # - setting: SOCIAL_AUTH_OIDC_KEY
    #   value: "JNOiwkoZ8H98HOWbUriObK2jHSNnHnaSJCT9CPxX"
    # - setting: SOCIAL_AUTH_OIDC_SECRET
    #   value: "Uc3O5FSuxUL85AZBZxEKMjd6Ms47dgJrnCRUKjpUIHCUSIwlbddC7lRhi1KjgTuLovUTrZKIBHpsxpoDHN8k5ryJ2Gm7Th84MSUoPH7wJvCLUAlLA4ZCJVjjr9USGOhr"
    # - setting: SOCIAL_AUTH_OIDC_OIDC_ENDPOINT
    #   value: "https://authentik.superasian.net/application/o/awx-sso/"
    # - setting: SOCIAL_AUTH_OIDC_VERIFY_SSL
    #   value: true

  service_annotations: |
    "prometheus.io/scrape": "true"
    "prometheus.io/path": "/api/v2/metrics"

  # Web Resource limits
  web_resource_requirements:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Task Resource Limits
  task_resource_requirements:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # Persistent storage for projects
  projects_persistence: true
  projects_storage_size: 10Gi
  projects_storage_access_mode: ReadWriteMany
