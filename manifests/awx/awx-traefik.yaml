apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: awx-traefik
  namespace: awx
  annotations:
    # Crucial flag to handle AWX's internal self-signed certificates backend
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - awx.superasian.net
    secretName: awx-custom-ca
  rules:
  - host: awx.superasian.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: awx-service
            port:
              number: 80
