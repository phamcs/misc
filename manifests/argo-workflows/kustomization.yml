apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - awf-server-ingress.yaml
  - awf-server-sso.yaml
  - wf-templates/cluster-wf-tpl.yaml
  - wf-templates/buildkit.yaml
  - wf-templates/gh-ci-pipeline.yaml
  - wf-templates/caddy-go-build.yaml
  - wf-templates/go-build.yaml
  - wf-templates/jenkins-pipeline.yaml

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: awf-values.yaml
