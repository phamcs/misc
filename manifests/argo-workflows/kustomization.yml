apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - sys/awf-binding.yaml
  - sys/awf-role.yaml
  - sys/awf-server-ingress.yaml
  - sys/awf-server-sso.yaml
  - tpl/cluster-wf-tpl.yaml
  - tpl/buildkit.yaml
  - tpl/caddy-go-build.yaml
  - tpl/gh-ci-pipeline.yaml
  - tpl/go-build.yaml
  - tpl/jenkins-pipeline.yaml

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: awf-values.yaml
