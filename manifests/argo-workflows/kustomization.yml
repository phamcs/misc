apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - argo-server-ingress.yaml
  - argo-server-role.yaml
  - argo-server-role-binding.yaml
  - ci-workflow.yaml
  - sso-secrets.yaml
  - trigger-workflow.yaml
  - workflow-sa.yaml
  - wf-templates/buildkit.yaml
  - wf-templates/go-build.yaml

helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: workflows-values.yaml
