apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

resources:
  - argo-server-ingress.yaml
  #- ci-pipeline.yaml
  #- eventsource.yaml
  #- sensor.yaml
  - sso-secrets.yaml
  - wf-templates/argocd-sync-and-wait.yaml
  - wf-templates/buildkit.yaml
  - wf-templates/go-build.yaml
  - wf-templates/jenkins-pipeline.yaml


helmCharts:
  - name: argo-workflows
    repo: https://argoproj.github.io/argo-helm
    version: 2.0.18
    releaseName: awf
    namespace: argo
    valuesFile: workflows-values.yaml
