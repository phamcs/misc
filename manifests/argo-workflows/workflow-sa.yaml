# sensor-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow-sa
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflow-role
  annotations:
    argocd.argoproj.io/tracking-id: >-
      argo:rbac.authorization.k8s.io/ClusterRole:argo/argo-workflow-role
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "workflowtaskresults", "secrets"]
    resourceNames: ["docker-registry-credentials"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-workflow-role-binding
  annotations:
    argocd.argoproj.io/tracking-id: >-
      argo:rbac.authorization.k8s.io/ClusterRoleBinding:argo/argo-workflow-role-binding
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflow-role
subjects:
  - kind: ServiceAccount
    name: argo-workflow-sa
    namespace: argo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-controller-sa
  namespace: argo
---
# Add workflow-controller to Rolebinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workflow-controller-role
  annotations:
    argocd.argoproj.io/tracking-id: >-
      argo:rbac.authorization.k8s.io/ClusterRole:argo/workflow-controller-role
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "workflowtaskresults", "secrets"]
    resourceNames: ["docker-registry-credentials"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workflow-controller-binding
  annotations:
    argocd.argoproj.io/tracking-id: >-
      argo:rbac.authorization.k8s.io/ClusterRoleBinding:argo/workflow-controller-role-binding
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workflow-controller-role
subjects:
  - kind: ServiceAccount
    name: workflow-controller-sa
    namespace: argo
