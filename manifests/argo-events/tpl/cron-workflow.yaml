apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: linter-cron-job
  namespace: argo-events
spec:
  schedules:
    - "0 */2 * * *" # Runs every 2 hrs
  timezone: "America/Denver"
  concurrencyPolicy: "Replace" # Options: Allow, Replace, Forbid
  startingDeadlineSeconds: 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  workflowSpec:
    workflowTemplateRef:
      name: manifests-linter
    arguments:
      parameters:
        - name: message
          value: "Linting manifests ..."
