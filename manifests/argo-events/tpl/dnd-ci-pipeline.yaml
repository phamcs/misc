apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dnd-ci-pipeline
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: dnd-sidecars
  templates:
    - name: dnd-build
      container:
        image: docker:24.0-cli
        command: [sh, -c]
        args:
          - |
            until docker info; do sleep 1; done
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
          - name: DOCKER_USERNAME
            valueFrom:
              secretKeyRef:
                name: argo-events/dockerhub
                key: username
          - name: DOCKER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: argo-events/dockerhub
                key: password
      sidecars:
        - name: dind
          image: docker:24.0-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""


        - name: security-scan
          inputs:
            parameters:
              - name: image
                value: phamcs/podinfo
              - name: tag
                value: master
              - name: cache-dir
                value: "/tmp/.cache"
          container:
            image: aquasec/trivy:latest
            command: [trivy]
            args:
              - image
              - --cache-dir
              - "{{inputs.parameters.cache-dir}}"
              - --exit-code
              - "1"
              - --severity
              - HIGH,CRITICAL
              - "{{inputs.parameters.image}}:{{inputs.parameters.tag}}"
            volumeMounts:
              - name: docker-config
                mountPath: /root/.docker
          # volumes:
          #   - name: docker-config
          #     secret:
          #       secretName: docker-registry-credentials
          #       items:
          #         - key: .dockerconfigjson
          #           path: config.json
