apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manifests-ci-pipeline
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: ci
  arguments:
    parameters:
      - name: git-repo
        value: https://github.com/phamcs/misc.git
      - name: git-revision
        value: main
      - name: image-name
        value: misc

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: ci
      dag:
        tasks:
          - name: checkout
            template: git-clone
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.git-repo}}"
                - name: revision
                  value: "{{workflow.parameters.git-revision}}"

          - name: build-and-push
            template: build-image
            dependencies: [checkout]
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image-name}}"

          - name: run-test
            template: run-test
            dependencies: [checkout]

          - name: update-manifests
            template: update-git-manifests
            dependencies: [build-and-push, run-test]
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image-name}}"
                - name: tag
                  value: "{{workflow.parameters.git-revision}}"

    - name: git-clone
      inputs:
        parameters:
          - name: repo
          - name: revision
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            git clone {{inputs.parameters.repo}} /workspace/misc
            cd /workspace/misc
            git checkout {{inputs.parameters.revision}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: build-image
      inputs:
        parameters:
          - name: image

      container:
        image: gcr.io/kaniko-project/executor:latest
        command: ["/kaniko/executor"]
        args:
          - "--dockerfile=/workspace/misc/Dockerfile"
          - "--context=/workspace/misc"
          #- "--no-push"
          - "--destination=phamcs/{{inputs.parameters.image}}:{{workflow.parameters.git-revision}}"
          - "--cache=true"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /kaniko/.docker
      #
      # Publishing images requires an access token. For hub.docker.com you can create one at https://hub.docker.com/settings/security
      # This needs to be mounted as `$DOCKER_CONFIG/config.json`. To do this, you'll need to create a secret as follows:
      #
      #   export DOCKER_USERNAME=******
      #   export DOCKER_TOKEN=******
      #   kubectl create secret generic docker-config --from-literal="config.json={\"auths\": {\"https://index.docker.io/v1/\": {\"auth\": \"$(echo -n $DOCKER_USERNAME:$DOCKER_TOKEN|base64)\"}}}"
      volumes:
        - name: docker-config
          secret:
            secretName: docker-registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json

    - name: run-test
      container:
        image: python:3.13-slim
        command: [sh, -c]
        args:
          - |
            pip install --no-cache-dir -q yamllint && yamllint /misc/manifests/
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: update-git-manifests
      inputs:
        parameters:
          - name: image
          - name: tag
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            # Clone the repository
            git clone https://$(GIT_USER):$(GIT_TOKEN)@github.com/phamcs/misc.git /tmp/misc
            cd /tmp/misc
            # Commit and push
            git config user.email "phamcs@gmail.com"
            git config user.name "CI Pipeline"
            git add .
            git commit -m "Update misc image to {{inputs.parameters.tag}}"
            git push origin HEAD:master
        env:
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: username
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token