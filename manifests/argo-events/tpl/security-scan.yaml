apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: security-scan-template
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: trivy-scan
  # Harden pod execution by disabling unnecessary service account token mounts
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  arguments:
    parameters:
      - name: image-name
        value: "alpine:latest"
  templates:
    - name: trivy-scan
      inputs:
        parameters:
          - name: image-name
          - name: cache-dir
            value: "/tmp/.cache"
      container:
        image: aquasec/trivy:latest
        command: [trivy]
        args:
          - image
          - --cache-dir
          - "{{inputs.parameters.cache-dir}}"
          - --ignore-unfixed
          - --exit-code
          - "1"
          - --severity
          - HIGH,CRITICAL
          - "{{inputs.parameters.image-name}}"
        volumeMounts:
          - name: docker-config
            mountPath: /root/.docker
      volumes:
        - name: docker-config
          secret:
            secretName: docker-registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json