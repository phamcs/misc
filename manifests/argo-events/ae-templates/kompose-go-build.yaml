apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  annotations:
    workflows.argoproj.io/description: |
      Checkout out from Git, build and test a Golang application.
    workflows.argoproj.io/maintainer: '@alexec'
    workflows.argoproj.io/tags: golang, git
    workflows.argoproj.io/version: '>= 2.9.0'
  name: kompose-go-build
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: main
  arguments:
    parameters:
      - name: revision
        value: "main" # Change to a specific tag like "v1.38.0" if needed
      - name: target-os
        value: "linux"
      - name: target-arch
        value: "amd64"
  templates:
    - name: build-source
      inputs:
        parameters:
          - name: revision
          - name: target-os
          - name: target-arch
        artifacts:
          # Clones the Kompose source code into /src before the container starts
          - name: kompose-src
            path: /src
            git:
              repo: https://github.com/phamcs/kompose.git
              revision: "{{inputs.parameters.revision}}"

      container:
        image: golang:1.23-bookworm
        workingDir: /src
        env:
          - name: CGO_ENABLED
            value: "0"
          - name: GOOS
            value: "{{inputs.parameters.target-os}}"
          - name: GOARCH
            value: "{{inputs.parameters.target-arch}}"
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            mkdir -p /out
            go build -ldflags="-s -w" -o /out/kompose main.go
            chmod +x /out/kompose
            ls -lh /out/kompose

      outputs:
        artifacts:
          # Saves the compiled binary to your Argo artifact store (S3/MinIO/GCS)
          - name: kompose-binary
            path: /out/kompose

  volumeClaimTemplates:
    # A shared work volume.
    - metadata:
        name: work
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi