apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci-pipeline
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: ci
  arguments:
    parameters:
      - name: git-repo
        value: https://github.com/phamcs/podinfo.git
      - name: git-revision
        value: master
      - name: image-name
        value: phamcs/podinfo
      - name: manifest-repo
        value: https://github.com/phamcs/podinfo.git
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

  templates:
    - name: ci
      dag:
        tasks:
          - name: checkout
            template: git-clone
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.git-repo}}"
                - name: revision
                  value: "{{workflow.parameters.git-revision}}"

          - name: build-and-push
            template: build-image
            dependencies: [checkout]
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image-name}}"

          - name: run-tests
            template: test
            dependencies: [checkout]

          - name: update-manifests
            template: update-git-manifests
            dependencies: [build-and-push, run-tests]
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image-name}}"
                - name: tag
                  value: "{{workflow.parameters.git-revision}}"

    - name: git-clone
      inputs:
        parameters:
          - name: repo
          - name: revision
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            git clone {{inputs.parameters.repo}} /workspace/source
            cd /workspace/source
            git checkout {{inputs.parameters.revision}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: build-image
      inputs:
        parameters:
          - name: image
      container:
        image: gcr.io/kaniko-project/executor:latest
        command: ["/kaniko/executor"]
        args:
          - "--dockerfile=/workspace/source/Dockerfile"
          - "--context=/workspace/source"
          - "--no-push"
          #- "--destination={{inputs.parameters.image}}:{{workflow.parameters.git-revision}}"
          #- "--cache=true"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /kaniko/.docker
      #
      # Publishing images requires an access token. For hub.docker.com you can create one at https://hub.docker.com/settings/security
      # This needs to be mounted as `$DOCKER_CONFIG/config.json`. To do this, you'll need to create a secret as follows:
      #
      #   export DOCKER_USERNAME=******
      #   export DOCKER_TOKEN=******
      #   kubectl create secret generic docker-config --from-literal="config.json={\"auths\": {\"https://index.docker.io/v1/\": {\"auth\": \"$(echo -n $DOCKER_USERNAME:$DOCKER_TOKEN|base64)\"}}}"
      volumes:
        - name: docker-config
          secret:
            secretName: docker-registry-credentials
            items:
              - key: .dockerconfigjson
                path: config.json

    - name: test
      container:
        image: golang:1.27
        command: [sh, -c]
        args:
          - |
            cd /workspace/source
            go test ./...
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: update-git-manifests
      inputs:
        parameters:
          - name: image
          - name: tag
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            # Clone the repository
            git clone https://$(GIT_USER):$(GIT_TOKEN)@github.com/phamcs/podinfo.git /tmp/podinfo
            cd /tmp/podinfo

            # Update the image tag in the deployment manifest
            sed -i "s|image: {{inputs.parameters.image}}:.*|image: {{inputs.parameters.image}}:{{inputs.parameters.tag}}|" \
              deploy/bases/backend/deployment.yaml
            sed -i "s|image: {{inputs.parameters.image}}:.*|image: {{inputs.parameters.image}}:{{inputs.parameters.tag}}|" \
              deploy/bases/frontend/deployment.yaml
            sed -i "s|image: {{inputs.parameters.image}}:.*|image: {{inputs.parameters.image}}:{{inputs.parameters.tag}}|" \
              deploy/webapp/backend/deployment.yaml
            sed -i "s|image: {{inputs.parameters.image}}:.*|image: {{inputs.parameters.image}}:{{inputs.parameters.tag}}|" \
              deploy/webapp/frontend/deployment.yaml
            sed -i 's/This is a pipeline test message/./g' README.md
            # Commit and push
            git config user.email "phamcs@gmail.com"
            git config user.name "CI Pipeline"
            git add .
            git commit -m "Update podinfo image to {{inputs.parameters.tag}}"
            git push origin HEAD:master
        env:
          - name: GIT_USER
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: username
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: token