apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: lint-argo-events
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: lint-pipeline
  arguments:
    parameters:
      - name: repo-url
        value: https://github.com/phamcs/misc.git
      - name: revision
        value: main
      - name: manifests-path
        value: manifests/
  templates:
    - name: lint-pipeline
      steps:
        - - name: lint-events
            template: argo-events-lint
            arguments:
              artifacts:
                - name: misc
                  git:
                    repo: "{{workflow.parameters.repo-url}}"
                    revision: "{{workflow.parameters.revision}}"

    - name: argo-events-lint
      inputs:
        artifacts:
          - name: misc
            path: /workspace/misc
      container:
        image: quay.io/argoproj/argo-events:latest
        command: [argo-events]
        args:
          - lint
          - --strict
          - -R
          - /workspace/misc/{{workflow.parameters.manifests-path}}
