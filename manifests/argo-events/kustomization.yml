apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - sys/binding.yaml
  - sys/docker-access.yaml
  - sys/eventbus.yaml
  - sys/eventsource-svc.yaml
  - sys/eventsource.yaml
  - sys/ingress.yaml
  - sys/role.yaml
  - sys/scm-access.yaml
  - sys/sensor-rbac.yaml
  - sys/sensor.yaml
  - tpl/caddy-go-build.yaml
  - tpl/ci-pipeline.yaml
  - tpl/cron-workflow.yaml
  - tpl/linter.yaml
  - tpl/manifests-ci-pipeline.yaml
  - tpl/manifests-linter.yaml
  - tpl/security-scan.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml
