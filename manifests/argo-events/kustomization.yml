apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - argo-events-binding.yaml
  - argo-events-ingress.yaml
  - argo-events-role.yaml
  #- ae-templates/ae-linter.yaml
  - eventbus.yaml
  - eventsource.yaml
  - sensor.yaml
  - sensor-rbac.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: events-values.yaml

patches:
  - target:
      kind: Service
      name: github-webhook-eventsource-svc
      namespace: argo-events
    patch: |-
      kind: Service
      apiVersion: v1
      metadata:
        name: github-webhook-eventsource-svc
        namespace: argo-events
        labels:
          controller: eventsource-controller
          eventsource-name: github-webhook
          owner-name: github-webhook
        annotations:
          kube-vip.io/vipHost: infra03
          metallb.io/ip-allocated-from-pool: default-pool
        ownerReferences:
          - apiVersion: argoproj.io/v1alpha1
            kind: EventSource
            name: github-webhook
            controller: true
            blockOwnerDeletion: true
      spec:
        selector:
          controller: eventsource-controller
          eventsource-name: github-webhook
          owner-name: github-webhook
        type: LoadBalancer
        sessionAffinity: None
        loadBalancerIP: 10.0.0.80
        externalTrafficPolicy: Cluster
        ipFamilies:
          - IPv4
        ipFamilyPolicy: SingleStack
        allocateLoadBalancerNodePorts: true
        internalTrafficPolicy: Cluster
      status:
        loadBalancer:
          ingress:
            - ip: 10.0.0.80
              ipMode: VIP