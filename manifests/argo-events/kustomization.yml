apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - sys/binding.yaml
  - sys/ingress.yaml
  - sys/linter.yaml
  - sys/role.yaml
  - sys/docker-access.yaml
  - sys/github-access.yaml
  - sys/gitlab-access.yaml
  - sys/eventsource-svc.yaml
  - sys/eventbus.yaml
  - sys/github-eventsource.yaml
  - sys/github-ci-sensor.yaml
  - sys/gitlab-eventsource.yaml
  - sys/gitlab-ci-sensor.yaml
  - sys/sensor-rbac.yaml
  - sys/scan-sensor.yaml
  - tpl/caddy-go-build.yaml
  - tpl/ci-pipeline.yaml
  - tpl/dnd-ci-pipeline.yaml
  - tpl/security-scan.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml
