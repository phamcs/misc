apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - eventbus.yaml
  - eventsource.yaml
  - sso-secrets.yaml
  - sensor.yaml
  - sensor-rbac.yaml
  #- wf-templates/*.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: events-values.yaml
