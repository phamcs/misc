apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - argo-events-binding.yaml
  - argo-events-ingress.yaml
  - argo-events-role.yaml
  - ae-templates/ae-lint-tpl.yaml
  - ae-templates/gh-ci-pipeline.yaml
  - eventbus.yaml
  - eventsource.yaml
  - sensor.yaml
  - sensor-rbac.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: events-values.yaml
