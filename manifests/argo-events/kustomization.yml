apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - sys/ae-binding.yaml
  - sys/ae-ingress.yaml
  - sys/ae-linter.yaml
  - sys/ae-role.yaml
  - sys/github-access.yaml
  - sys/github-eventsource-svc.yaml
  - sys/eventbus.yaml
  - sys/eventsource.yaml
  - sys/sensor.yaml
  - sys/sensor-rbac.yaml
  - tpl/caddy-go-build.yaml
  - tpl/ci-pipeline.yaml
  - tpl/kompose-go-build.yaml


helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml
