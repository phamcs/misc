apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - argo-events-binding.yaml
  - argo-events-role.yaml
  - eventbus.yaml
  - eventsource.yaml
  - sensor.yaml
  - sensor-rbac.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: events-values.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: webhook-eventsource-svc
      namespace: argo-events
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/loadBalancerIP
        value: "10.0.0.80"
      - op: add
        path: /status/loadBalancer/ingress/ip
        value: "10.0.0.80"
      - op: add
        path: /status/loadBalancer/ingress/ipMode
        value: VIP
