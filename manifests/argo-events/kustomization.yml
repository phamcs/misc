apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - ae-binding.yaml
  #- ae-eventsource-lb.yaml
  - ae-ingress.yaml
  - ae-linter.yaml
  - ae-role.yaml
  - ae-templates/caddy-go-build.yaml
  - ae-templates/gh-ci-pipeline.yaml
  - eventbus.yaml
  - eventsource.yaml
  - sensor.yaml
  - sensor-rbac.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: webhook-eventsource-svc
      namespace: argo-events
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: webhook-eventsource-svc
        namespace: argo-events
        annotations:
          metallb.io/address-pool: default-pool    # Replace with your pool name
          metallb.io/loadBalancerIPs: 10.0.0.80    # Replace with your IP
      spec:
        type: LoadBalancer
        ports:
          - port: 12000
            targetPort: 12000
            protocol: TCP
        selector:
          eventsource-name: webhook-eventsource-svc