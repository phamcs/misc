apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

resources:
  - ae-binding.yaml
  #- ae-eventsource-lb.yaml
  - ae-ingress.yaml
  - ae-linter.yaml
  - ae-role.yaml
  - ae-templates/caddy-go-build.yaml
  - ae-templates/gh-ci-pipeline.yaml
  - eventbus.yaml
  - eventsource.yaml
  - sensor.yaml
  - sensor-rbac.yaml

helmCharts:
  - name: argo-events
    repo: https://argoproj.github.io/argo-helm
    version: 2.4.28
    releaseName: ae
    namespace: argo-events
    valuesFile: ae-values.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: webhook-eventsource-svc
      namespace: argo-events
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

      - op: add
        path: /spec/loadBalancerIP
        value: 10.0.0.80
