kind: Service
apiVersion: v1
metadata:
  name: webhook-eventsource-svc
  namespace: argo-events
  labels:
    controller: eventsource-controller
    eventsource-name: webhook
    owner-name: webhook
  annotations:
    metallb.io/ip-allocated-from-pool: default-pool
  ownerReferences:
    - apiVersion: argoproj.io/v1alpha1
      kind: EventSource
      name: webhook
      controller: true
      blockOwnerDeletion: true
spec:
  ports:
    - protocol: TCP
      port: 12000
      targetPort: 12000
  selector:
    controller: eventsource-controller
    eventsource-name: webhook
    owner-name: webhook
  type: LoadBalancer
  sessionAffinity: None
  loadBalancerIP: 10.0.0.80
  externalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  allocateLoadBalancerNodePorts: true
  internalTrafficPolicy: Cluster
status:
  loadBalancer:
    ingress:
      - ip: 10.0.0.80
        ipMode: VIP