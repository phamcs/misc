apiVersion: v1
kind: Service
metadata:
  name: webhook-eventsource-custom-svc
  annotations:
    metallb.io/address-pool: default-pool    # Replace with your pool name
    metallb.io/loadBalancerIPs: 10.0.0.94    # Replace with your IP
spec:
  type: LoadBalancer # Or ClusterIP / NodePort
  loadBalancerIP: "10.0.0.80"
  ports:
    - port: 12000
      protocol: TCP
      targetPort: 12000
  selector:
    eventsource-name: webhook