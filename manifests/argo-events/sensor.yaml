apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: test-dep
      eventSourceName: webhook
      eventName: deploy
  triggers:
    - template:
        name: webhook-workflow-trigger
        k8s:
          group: argoproj.io
          version: v1alpha1
          resource: workflows
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-
              spec:
                entrypoint: whalesay
                arguments:
                  parameters:
                  - name: message
                    # the value will get overridden by event payload from test-dep
                    value: hello world
                templates:
                - name: whalesay
                  inputs:
                    parameters:
                    - name: message
                  container:
                    image: docker/whalesay:latest
                    command: [cowsay]
                    args: ["{{inputs.parameters.bucket}}","{{inputs.parameters.key}}"]
          parameters:
            - src:
                dependencyName: test-dep
                dataKey: body.bucket
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: test-dep
                dataKey: body.key
              dest: spec.arguments.parameters.1.value
    - templates:
      - name: lint-pipeline
        steps:
          - - name: run-argo-events-lint
              template: argo-events-lint
              arguments:
                parameters:
                  - name: path
                    value: "{{workflow.parameters.manifest-path}}"

      - name: argo-events-lint
        inputs:
          parameters:
            - name: path
          artifacts:
            # Replace with your git repo or volume mount containing the manifests
            - name: misc
              path: manifests/
              git:
                repo: https://github.com/phamcs/misc.git
                revision: main
        container:
          image: quay.io/argoproj/argo-events:latest
          command: [argo-events]
          args: ["lint", "-R", "{{inputs.parameters.path}}"]
          workingDir: manifests/