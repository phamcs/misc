apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    github:
      endpoint: /push
      method: POST
      port: "12000"
      # Specify target repository owner and repo name
      owner: phamcs
      repositories:
        - name: misc
      # Events to listen for (e.g., push, pull_request, etc.)
      events:
        - push
      url: "http://ae.superasian.net"

