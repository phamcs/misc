apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-events-ingress
  namespace: argo-events
  annotations:
    # Crucial flag to handle Argo-Events's internal self-signed certificates backend
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argo-events
    secretName: argo-events-tls
  rules:
    - host: argo-events
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: github-webhook-eventsource-svc
              port:
                number: 12000
