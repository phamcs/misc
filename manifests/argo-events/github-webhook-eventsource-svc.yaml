kind: Service
apiVersion: v1
metadata:
  name: github-webhook-eventsource-svc
  namespace: argo-events
  labels:
    controller: eventsource-controller
    eventsource-name: github-webhook
    owner-name: github-webhook
  annotations:
    kube-vip.io/vipHost: infra03
    metallb.io/ip-allocated-from-pool: default-pool
  ownerReferences:
    - apiVersion: argoproj.io/v1alpha1
      kind: EventSource
      name: github-webhook
      controller: true
      blockOwnerDeletion: true
spec:
  # ports:
  #   - protocol: TCP
  #     port: 12000
  #     targetPort: 12000
  #     nodePort: 32382
  selector:
    controller: eventsource-controller
    eventsource-name: github-webhook
    owner-name: github-webhook
  type: LoadBalancer
  sessionAffinity: None
  loadBalancerIP: 10.0.0.80
  externalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  allocateLoadBalancerNodePorts: true
  internalTrafficPolicy: Cluster
status:
  loadBalancer:
    ingress:
      - ip: 10.0.0.80
        ipMode: VIP
