# platform/sensor.yaml
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: github-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: github-dep
      eventSourceName: github
      eventName: github
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - "refs/heads/main"
  triggers:
    - template:
        name: trigger-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: wf-
                namespace: argo-events
              spec:
                workflowTemplateRef:
                  name: ci-pipeline
                arguments:
                  parameters:
                    - name: commit-sha
                      value: ""
          parameters:
            - src:
                dependencyName: github-dep
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: dockerhub-sensor
  namespace: argo-events
spec:
  dependencies:
    - name: dockerhub-dep
      eventSourceName: dockerhub
      eventName: dockerhub
  triggers:
    - template:
        name: trigger-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: deploy-image-
              spec:
                entrypoint: main
                arguments:
                  parameters:
                    - name: image-tag
                      value: latest # Overwritten by parameter mapping below
                templates:
                  - name: main
                    inputs:
                      parameters:
                        - name: image-tag
                    container:
                      image: alpine:latest
                      command: [echo]
                      args: ["New image pushed with tag: {{inputs.parameters.image-tag}}"]
          parameters:
            - src:
                dependencyName: dockerhub-dep
                dataKey: body.push_data.tag
              dest: spec.arguments.parameters.0.value
