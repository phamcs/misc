apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-eventsource-ingress
  namespace: argo-events
  annotations:
    # Crucial flag to handle Argo-Events's internal certificates backend
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - github-eventsource-svc
    secretName: github-eventsource-svc-tls
  rules:
    - host: github-eventsource-svc
      http:
        paths:
        - path: /push
          pathType: Prefix
          backend:
            service:
              name: github-eventsource-svc
              port:
                number: 12000
---
