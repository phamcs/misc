apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: gitlab
  namespace: argo-events
spec:
  serviceAccountName: operate-workflow-sa
  gitlab:
    gitlab:
      groups:
        - devsecops
      webhook:
        endpoint: /scan
        port: "12000"
        method: POST
        url: ""
      events:
        - PushEvents
        - MergeRequestsEvents
      accessToken:
        name: gitlab-access
        key: token
      enableSSLVerification: true
      # Set to true to remove the webhook from GitLab when the EventSource is deleted
      deleteHookOnFinish: true
      # Optional: specify if using a self-managed GitLab instance
      # gitlabBaseURL: https://your-company.com

