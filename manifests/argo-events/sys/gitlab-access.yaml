apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-webhook-secret
  namespace: argo-events
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-external
    kind: ClusterSecretStore
  target:
    name: gitlab-webhook-secret # Name of the native K8s Secret ESO will create
    creationPolicy: Owner
  data:
    - secretKey: token #  Gitlab-Webhook secret
      remoteRef:
        key: argo-events/gitlab # Path in your external vault
        property: token