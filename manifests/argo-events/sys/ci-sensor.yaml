# platform/sensor.yaml
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: github-ci-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: github-ci-dep
      eventSourceName: github
      eventName: github-push-event
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - "refs/heads/main"
  triggers:
    - template:
        name: trigger-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: wf-
                namespace: argo-events
              spec:
                workflowTemplateRef:
                  name: ci-pipeline
                arguments:
                  parameters:
                    - name: commit-sha
                      value: ""
          parameters:
            - src:
                dependencyName: github-ci-dep
                dataKey: body.after
              dest: spec.arguments.parameters.0.value
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: gitlab-ci-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: gitlab-ci-dep
      eventSourceName: gitlab
      eventName: gitlab-push-event
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - "refs/heads/main"
  triggers:
    - template:
        name: trigger-security-scan
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: wf-
                namespace: argo-events
              spec:
                workflowTemplateRef:
                  name: security-scan-template
                arguments:
                  parameters:
                    - name: image-name
                      value: "placeholder"
          # Overwrite the placeholder with the payload's image field
          parameters:
            - src:
                dependencyName: gitlab-ci-dep
                dataKey: body.image
              dest: spec.arguments.parameters.0.value