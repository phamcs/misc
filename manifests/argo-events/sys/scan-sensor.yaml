apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: security-scan-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: scan-dep
      eventSourceName: trivy
      eventName: image-push
      filters:
        data:
          - path: body.ref
            type: string
            value:
              - "refs/heads/main"
  triggers:
    - template:
        name: trigger-security-scan
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: security-scan-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: security-scan-template
                arguments:
                  parameters:
                    - name: image-name
                      value: "placeholder"
          # Overwrite the placeholder with the payload's image field
          parameters:
            - src:
                dependencyName: scan-dep
                dataKey: body.image
              dest: spec.arguments.parameters.0.value

