# sensor-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-webhook-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: events-webhook-role
  namespace: argo-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "workflowtaskresults", "secrets"]
    resourceNames: ["docker-registry-credentials"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: events-webhook-role-binding
  namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: events-webhook-role
subjects:
  - kind: ServiceAccount
    name: events-webhook-sa
    namespace: argo-events
