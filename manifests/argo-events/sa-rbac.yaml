---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager-sa
  namespace: argo-events
---
# Add workflow-controller to Rolebinding
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-manager-role
  namespace: argo-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "workflowtaskresults", "secrets"]
    resourceNames: ["docker-registry-credentials"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-manager-binding
  namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-manager-role
subjects:
  - kind: ServiceAccount
    name: controller-manager-sa
    namespace: argo-events
