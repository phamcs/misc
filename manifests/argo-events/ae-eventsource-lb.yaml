apiVersion: v1
kind: Service
metadata:
  name: webhook-eventsource-lb
  namespace: argo-events
  annotations:
    metallb.io/address-pool: default-pool    # Replace with your pool name
    metallb.io/loadBalancerIPs: 10.0.0.80    # Replace with your IP
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 12000
      protocol: TCP
  selector:
    eventsource-name: webhook-eventsource-svc