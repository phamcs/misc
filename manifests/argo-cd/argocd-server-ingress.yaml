apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # Crucial flag to handle ArgoCD's internal self-signed certificates backend
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/rewrite-target: "/$2"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argocd-server
    secretName: argocd-server-tls
  rules:
    - host: argocd-server
      http:
        paths:
        - path: /cd(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: argocd-server
              port:
                number: 80
