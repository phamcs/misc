apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  #- custom-deployment.yaml
  - argocd-server-http-ingress.yaml
  - argocd-server-grpc-ingress.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.14.0
    releaseName: argocd
    namespace: argocd
    valuesFile: argocd-values.yaml