apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

configurations:
- rollout-transform.yaml

resources:
  - argo-rollouts-ingress.yaml


helmCharts:
  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: 2.43.11
    releaseName: aro
    namespace: argo-rollouts
    valuesFile: rollouts-values.yaml
