apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

configurations:
  - rollout-transform.yaml

resources:
  - argo-rollouts-ingress.yaml
  - rollout-carnary.yaml
  # - ci-workflow.yaml
  # - eventbus.yaml
  # - eventsource.yaml
  # - sso-secrets.yaml
  # - sensor.yaml
  # - sensor-rbac.yaml
  # - trigger-workflow.yaml
  #- wf-templates/*.yaml

helmCharts:
  # - name: argo-workflows
  #   repo: https://argoproj.github.io/argo-helm
  #   version: 2.0.18
  #   releaseName: awf
  #   namespace: argo
  #   valuesFile: workflows-values.yaml

  # - name: argo-events
  #   repo: https://argoproj.github.io/argo-helm
  #   version: 2.4.28
  #   releaseName: ae
  #   namespace: argo-events
  #   valuesFile: events-values.yaml

  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: 2.43.10
    releaseName: aro
    namespace: argo-rollouts
    valuesFile: rollouts-values.yaml

openapi:
  path: https://raw.githubusercontent.com/argoproj/argo-schema-generator/main/schema/argo_all_k8s_kustomize_schema.json

patches:
- patch: |-
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    metadata:
      name: rollout-canary
    spec:
      template:
        spec:
          containers:
          - name: rollouts-demo
            image: nginx
