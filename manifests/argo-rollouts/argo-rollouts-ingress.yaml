apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-rollouts-ingress
  namespace: argo-rollouts
  annotations:
    # Crucial flag to handle ArgoCD's internal self-signed certificates backend
    cert-manager.io/cluster-issuer: internal-ca-issuer
    traefik.ingress.kubernetes.io/backend-protocol: "HTTP"
    traefik.ingress.kubernetes.io/force-ssl-redirect: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - argo-rollouts
    secretName: argo-rollouts-tls
  rules:
    - host: argo-rollouts
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: argo-rollouts
              port:
                number: 8090