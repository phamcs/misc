apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - ctm-clusterissuer.yaml


helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.20.2   # Replace with the latest or desired version
    releaseName: cert-manager
    valuesFile: cm-values.yaml

  - name: trust-manager
    repo: https://charts.jetstack.io
    version: 0.26.0   # Replace with the latest or desired version
    releaseName: trust-manager
    valuesFile: tm-values.yaml

patches:
  - target:
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: "true"
