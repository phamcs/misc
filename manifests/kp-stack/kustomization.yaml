apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - configmap.yaml
  - secrets.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 83.6.0
    releaseName: kp-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kp-stack-grafana # Replace with your Grafana deployment name
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_SERVER_ROOT_URL
          value: "https://analytics.superasian.net"