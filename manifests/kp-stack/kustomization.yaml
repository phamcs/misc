apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - secrets.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 92.11.1
    releaseName: kp-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: prometheus-values.yaml

  - name: influxdb
    repo: https://helm.influxdata.com/
    version: 4.12.5 # Replace with the latest or desired version
    releaseName: influxdb
    valuesFile: influxdb-values.yaml

  # - name: telegraf-operator
  #   repo: https://helm.influxdata.com/
  #   version: 1.4.0 # Replace with the latest or desired version
  #   releaseName: telegraf-operator
  #   valuesFile: telegraf-ops-values.yaml

patches:
  # Inline multiple patch method
  - target:
      version: v1
      kind: Deployment
      name: kp-stack-grafana
      namespace: monitoring
    patch: |
      - op: add
        # This setting needs to be on specific containers grafana
        path: /spec/template/spec/containers/2/env/-
        value:
          name: GF_SERVER_ROOT_URL
          value: "https://analytics.superasian.net"

  - target:
      version: v1
      kind: Service
      name: kp-stack-grafana
      namespace: monitoring
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: kube-prometheus-stack-grafana
        annotations:
          metallb.universe.tf/address-pool: default-pool    # Replace with your pool name
          metallb.universe.tf/loadBalancerIPs: 10.0.0.94    # Replace with your IP
      spec:
        type: LoadBalancer

  - target:
      kind: ConfigMap
      name: kp-stack-grafana
      namespace: monitoring
    patch: |-
      kind: ConfigMap
      apiVersion: v1
      metadata:
        name: kp-stack-grafana
        namespace: monitoring
        labels:
          app.kubernetes.io/instance: kp-stack
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: grafana
          app.kubernetes.io/version: 12.0.2
          helm.sh/chart: grafana-12.0.2
        annotations:
          meta.helm.sh/release-name: kp-stack
          meta.helm.sh/release-namespace: monitoring
      data:
        grafana.ini: >
          [analytics]

          check_for_updates = true

          [log]

          mode = console

          [paths]

          data = /var/lib/grafana/

          logs = /var/log/grafana

          plugins = /var/lib/grafana/plugins

          provisioning = /etc/grafana/provisioning

          [database]
          # Either "mysql", "postgres" or "sqlite3", it's your choice
          type = postgres

          host = 10.0.0.252:5432

          name = kp-stack-grafana

          user = grafana

          password = DAs8Ay4UWhjayE9VPqoUcPOQDrl98Y1oms2shAYgb8

          # For "postgres" only, either "disable", "require" or "verify-full"
          ssl_mode = disable

          # For "sqlite3" only, path relative to data_path setting
          ;path = grafana.db

          [plugins]

          preinstall_auto_update = false

          [server]

          domain = ''

          [unified_storage]

          index_path = /var/lib/grafana-search/bleve

          [auth.generic_oauth]

          enabled = true

          name = OIDC

          allow_sign_up = true

          client_id = uBLNiMNts5RLPKk2JfUDJajpX2J3LbwQfJGGacEx

          client_secret =
          WF2CVV5WnEV5jEJQgO8sgvfMP6Lwmp6d6KlkAkYoPCzBWThe24hwjmlDYbYpyRciYAL8IJxBx14U9gX7L1vLp7mzD8MlErUTCIt6sLjoRYBOvpbLIr9IIG1tcoZ6emhr

          scopes = openid profile email groups offline_access

          auth_url = https://authentik.superasian.net/application/o/authorize/

          token_url = https://authentik.superasian.net/application/o/token/

          api_url = https://authentik.superasian.net/application/o/userinfo/

          # Optional: JWK validation for ID tokens

          validate_id_token = true

          jwk_set_url = https://authentik.superasian.net/application/o/grafana/jwks/

          # Optional: Role mapping and team sync

          role_attribute_path = contains(groups[*], 'grafana-admin') && 'Admin' ||
          contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'

          use_refresh_token = true

          skip_org_role_sync: true


