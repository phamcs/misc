apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  #- configmap.yaml
  - secrets.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 75.6.1
    releaseName: kp-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values.yaml

patches:
  # Inline multiple patch method
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_SERVER_ROOT_URL
          value: "https://analytics.superasian.net"
    target:
      kind: Deployment
      name: kp-stack

  - patch: |
      - op: add
        path: /metadata/annotations
        value:
          metallb.io/loadBalancerIPs: 10.0.0.94
      # - op: replace
      #   path: /spec/type
      #     value: LoadBalancer
    target:
      kind: Service
      name: kp-stack-grafana

  - patch: |
      - op: add
        path: /data/grafana.ini
        value: |
          [auth.generic_oauth]
          enabled = true
          name = OIDC
          allow_sign_up = true
          client_id = uBLNiMNts5RLPKk2JfUDJajpX2J3LbwQfJGGacEx
          client_secret = WF2CVV5WnEV5jEJQgO8sgvfMP6Lwmp6d6KlkAkYoPCzBWThe24hwjmlDYbYpyRciYAL8IJxBx14U9gX7L1vLp7mzD8MlErUTCIt6sLjoRYBOvpbLIr9IIG1tcoZ6emhr
          scopes = openid profile email ogffline_access
          auth_url = https://authentik.superasian.net/application/o/authorize/
          token_url = https://authentik.superasian.net/application/o/token/
          api_url = https://authentik.superasian.net/application/o/userinfo/

          # Optional: JWK validation for ID tokens
          validate_id_token = true
          jwk_set_url = https://authentik.superasian.net/application/o/grafana/jwks/

          # Optional: Role mapping and team sync
          role_attribute_path = contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
          use_refresh_token = true
          skip_org_role_sync: true
    target:
      kind: ConfigMap
      name: kp-stack-grafana

  # Inline target patch method
