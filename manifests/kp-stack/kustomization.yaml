apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  #- configmap.yaml
  - secrets.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 75.6.1
    releaseName: kp-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: values.yaml

patches:
  # Inline multiple patchs method
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_SERVER_ROOT_URL
          value: "https://analytics.superasian.net"
    target:
      kind: Deployment
      name: kp-stack

  - patch: |
      - op: add
        path: /metadata/annotations
        value:
          metallb.io~1loadBalancerIPs: 10.0.0.94
      - op: replace
        path: /spec/type
          value: LoadBalancer
    target:
      kind: Service
      name: kp-stack-grafana