kind: ConfigMap
apiVersion: v1
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.4
    helm.sh/chart: grafana-14.0.1
  annotations:
    meta.helm.sh/release-name: kube-prometheus-stack
    meta.helm.sh/release-namespace: monitoring
data:
  grafana.ini: >
    [analytics]

    check_for_updates = true

    [log]

    mode = console

    [paths]

    data = /var/lib/grafana/

    logs = /var/log/grafana

    plugins = /var/lib/grafana/plugins

    provisioning = /etc/grafana/provisioning

    [plugins]

    preinstall_auto_update = false

    [server]

    domain = ''

    [unified_storage]

    index_path = /var/lib/grafana-search/bleve

    [auth.generic_oauth]

    enabled = true

    name = OIDC

    allow_sign_up = true

    client_id = uBLNiMNts5RLPKk2JfUDJajpX2J3LbwQfJGGacEx

    client_secret =
    WF2CVV5WnEV5jEJQgO8sgvfMP6Lwmp6d6KlkAkYoPCzBWThe24hwjmlDYbYpyRciYAL8IJxBx14U9gX7L1vLp7mzD8MlErUTCIt6sLjoRYBOvpbLIr9IIG1tcoZ6emhr

    scopes = openid profile email ogffline_access

    auth_url = https://authentik.superasian.net/application/o/authorize/

    token_url = https://authentik.superasian.net/application/o/token/

    api_url = https://authentik.superasian.net/application/o/userinfo/

    # Optional: JWK validation for ID tokens

    validate_id_token = true

    jwk_set_url = https://authentik.superasian.net/application/o/grafana/jwks/


    # Optional: Role mapping and team sync

    role_attribute_path = contains(groups[*], 'grafana-admin') && 'Admin' ||
    contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'

    use_refresh_token = true

    skip_org_role_sync: true
