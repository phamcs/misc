apiVersion: v1
data:
  deployAPIToAPIManager: "false"
  deployAPIToMicrogateway: "true"
kind: ConfigMap
metadata:
  name: api-controller-config
---
apiVersion: v1
data:
  apimCredentialsSecret: apim-secret
  apimKeymanagerEndpoint: https://apim.wso2.com
  apimPublisherEndpoint: https://apim.wso2.com
  apimTokenEndpoint: https://apim.wso2.com/oauth2/token
  insecureSkipVerify: "true"
kind: ConfigMap
metadata:
  name: apim-config
---
apiVersion: v1
data:
  mgwAdapterHost: https://adapter.default:9843
  mgwInsecureSkipVerify: "true"
kind: ConfigMap
metadata:
  name: envoy-mgw-configs
---
apiVersion: v1
data:
  autoIngressCreation: "true"
  enableAutoScale: "false"
  hpaMetrics: |
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  livenessProbe: |
    tcpSocket:
      port: 8290
    initialDelaySeconds: 10
    periodSeconds: 5
  maxReplicas: "5"
  minReplicas: "1"
  readinessProbe: |
    httpGet:
      path: /healthz
      port: 9201
    initialDelaySeconds: 10
    periodSeconds: 5
  reconcileInterval: "10"
kind: ConfigMap
metadata:
  name: integration-config
---
apiVersion: v1
data:
  ingress.properties: |
    kubernetes.io/ingress.class: traefik
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: false
  ingressHostName: wso2ei.ingress.wso2.com
  ingressResourceName: api-operator-ingress
  ingressTransportMode: https
kind: ConfigMap
metadata:
  name: integration-ingress-config
---
apiVersion: v1
data:
  resourceLimitCPUTarget: 500m
  resourceLimitMemoryTarget: 512Mi
  resourceRequestCPUTarget: 500m
  resourceRequestMemoryTarget: 512Mi
kind: ConfigMap
metadata:
  name: target-endpoint-controller-config
---
apiVersion: v1
data:
  hpaVersion: v2beta1
  mgwMaxReplicas: "5"
  mgwMetrics: |
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_total_value_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: 100m
    # - type: Object
    #   object:
    #     metric:
    #       name: requests-per-second
    #     describedObject:
    #       apiVersion: networking.k8s.io/v1beta1
    #       kind: Ingress
    #       name: main-route
    #     target:
    #       type: Value
    #       value: 10k
  mgwMetricsV2beta1: |
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 50
  targetEndpointMaxReplicas: "5"
  targetEndpointMetrics: |
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  targetEndpointMetricsV2beta1: |
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 50
kind: ConfigMap
metadata:
  name: target-endpoint-hpa-config
---
apiVersion: v1
data:
  apim.pem: 
kind: Secret
metadata:
  name: apim-cert-secret
type: Opaque
---
apiVersion: v1
data:
  cert_security: YXBpbS1jZXJ0LXNlY3JldA==
  password: YWRtaW4=
  username: YWRtaW4=
kind: Secret
metadata:
  name: apim-secret
type: Opaque
---
apiVersion: v1
data:
  mgwCertSecretName: ZW52b3ltZ3ctY2VydC1zZWNyZXQ=
  password: YWRtaW4=
  username: YWRtaW4=
kind: Secret
metadata:
  name: envoymgw-adapter-secret
type: Opaque
---
apiVersion: v1
data:
  adapter.pem: 
kind: Secret
metadata:
  name: envoymgw-cert-secret
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    name: api-operator
  name: operator-service
spec:
  ports:
  - name: https-operator
    nodePort: 30445
    port: 9445
    protocol: TCP
    targetPort: 9445
  selector:
    name: api-operator
  type: NodePort
