apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - secrets.yaml

helmCharts:
  - name: influxdb
    repo: https://helm.influxdata.com/
    version: 4.12.5 # Replace with the latest or desired version
    releaseName: influxdb2
    valuesFile: influxdb2-values.yaml

  - name: telegraf-operator
    repo: https://helm.influxdata.com/
    version: 1.4.0 # Replace with the latest or desired version
    releaseName: telegraf-operator
    valuesFile: telegraf-ops-values.yaml

