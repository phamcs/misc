replicaCount: 1
image:
  repository: quay.io/influxdb/telegraf-operator
  pullPolicy: IfNotPresent
  sidecarImage: "docker.io/library/telegraf:1.22"

classes:
  secretName: "telegraf-operator-classes"
  default: "k8s"
  data:
    k8s: |
      # Read metrics from InfluxDB (if you want to pull data from InfluxDB to Prometheus)
      [[inputs.influxdb]]
        urls = ["http://cluster.local"]

      # OR read from standard system/Kubernetes inputs
      [[inputs.cpu]]
      [[inputs.mem]]

      # Expose all collected metrics to Prometheus
      [[outputs.prometheus_client]]
        listen = ":9126"
        path = "/metrics"
        expiration_interval = "60s"

      # Output to InfluxDB
      [[outputs.influxdb]]
        urls = ["http://influxdb2:8086"]
      [global_tags]
        env = "ci"
        hostname = "influxdb2"
        nodename = "influxdb2"
        type = "k8s"

certManager:
  enable: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Annotations to add to the service account
  annotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
sidecarResources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 10m
    memory: 10Mi
nodeSelector: {}
tolerations: []
affinity: {}
requireAnnotationsForSecret: false
enableDefaultInternalPlugin: true
# allow hot reload ; disabled by default to support versions of telegraf
# that do not support hot-reload and --watch-config flag
hotReload: false