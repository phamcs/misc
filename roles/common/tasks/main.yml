---
- name: Populate service facts
  ansible.builtin.service_facts: {}

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Include Debian-specific tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == 'Debian' or ansible_os_family == 'Ubuntu'

- name: Include RedHat-specific tasks
  ansible.builtin.include_tasks: rhel.yml
  when: ansible_os_family == 'RedHat' or ansible_os_family == 'Rocky'

- name: Satisfy OS Pre-Reqs
  ansible.builtin.include_tasks: pre_reqs.yml

- name: Check if rke2 is running
  ansible.builtin.shell: |
    systemctl status rke2-server.service
    systemctl status rke2-agent.service
  register: rke2_services
  ignore_errors: true

# Display rke2 services
- name: Display rke2 services result standard output lines
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ rke2_services.stdout_lines }}"
  when: rke2_services.stdout_lines is defined

- name: Include rke2-extras
  ansible.builtin.include_role:
    name: common
    tasks_from: rke2-extras
  when: rke2_services.stdout == 'running'