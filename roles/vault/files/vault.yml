---
# Setup HashiCorp Vault
services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    user: "1000"
    ports:
    - "8200:8200"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    ulimits:
      memlock:
        soft: "-1"
        hard: "-1"
    environment:
      VAULT_API_ADDR: "https://vault.superasian.net"
      #VAULT_SKIP_VERIFY: true
      VAULT_LOG_FORMAT: json
      VAULT_LOG_LEVEL: info
      VAULT_CLIENT_TIMEOUT: 60s
      # Version 2.x bugfix
      SKIP_SETCAP: true
      SKIP_CHOWN: true
    cap_add:
    - IPC_LOCK
    volumes:
      - /srv/AppData/vault/config:/vault/config
      - /srv/AppData/vault/ssl:/vault/ssl
      - /srv/AppData/vault/logs:/vault/logs
      - /srv/AppData/vault/data:/vault/file
      - /srv/AppData/vault/plugins:/vault/plugins
    network_mode: bridge
    restart: always
    healthcheck:
      retries: 5
    entrypoint: vault server -config=/vault/config/vault.hcl
